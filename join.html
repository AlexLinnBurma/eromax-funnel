<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join VIP Telegram - xleakedarea.site</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { red: '#ff2a5f', dark: '#0a0a0c', card: '#16161a', border: '#27272a' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-brand-dark text-gray-100 min-h-screen flex items-center justify-center font-sans selection:bg-brand-red selection:text-white px-4">

    <div class="max-w-md w-full bg-brand-card border border-brand-border rounded-2xl shadow-2xl p-6 sm:p-8 text-center relative overflow-hidden">
        
        <!-- Top Glow Effect -->
        <div class="absolute -top-12 -left-12 w-32 h-32 bg-blue-600/20 rounded-full blur-2xl pointer-events-none"></div>
        <div class="absolute -bottom-12 -right-12 w-32 h-32 bg-brand-red/20 rounded-full blur-2xl pointer-events-none"></div>

        <!-- Telegram Icon Header -->
        <div class="w-20 h-20 bg-blue-600/20 text-blue-500 rounded-full flex items-center justify-center text-4xl mx-auto mb-5 border border-blue-500/30 shadow-inner">
            <i class="fa-brands fa-telegram"></i>
        </div>

        <h1 class="text-2xl sm:text-3xl font-extrabold text-white mb-2">Join VIP Telegram</h1>
        <p class="text-gray-400 text-sm mb-6">To access the full 50GB media archive and daily unreleased leaks, join our official secure Telegram channel below.</p>

        <!-- Steps Box -->
        <div class="bg-brand-dark/60 border border-brand-border rounded-xl p-4 text-left mb-6 text-xs sm:text-sm space-y-3">
            <div class="flex items-center gap-3 text-gray-300">
                <span class="w-6 h-6 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-xs flex-shrink-0">1</span>
                <span>Click the button below to open Telegram.</span>
            </div>
            <div class="flex items-center gap-3 text-gray-300">
                <span class="w-6 h-6 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-xs flex-shrink-0">2</span>
                <span>Join our channel & verify membership.</span>
            </div>
            <div class="flex items-center gap-3 text-gray-300">
                <span class="w-6 h-6 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-xs flex-shrink-0">3</span>
                <span>Unlock instant access to mirror links.</span>
            </div>
        </div>

        <!-- Action Button -->
        <a href="https://t.me/your_telegram_channel" target="_blank" onclick="triggerRedirect()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg shadow-blue-600/30 transition transform hover:-translate-y-0.5 flex items-center justify-center gap-2 text-base mb-3">
            <i class="fa-brands fa-telegram text-xl"></i> Join Channel Now
        </a>

        <a href="https://xleakedarea.site" class="text-xs text-gray-500 hover:text-gray-300 transition">
            &larr; Back to Main Portal
        </a>

    </div>

    <script>
        function triggerRedirect() {
            // Optional secondary monetization trigger on Telegram join click
            setTimeout(() => {
                window.open('https://your-adsterra-direct-link.com', '_blank');
            }, 1000);
        }
    </script>
</body>
</html>
